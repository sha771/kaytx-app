name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit -- --ci
      - name: Build & Push Docker Image
        run: |
          docker build -t kaytx-backend:${{ github.sha }} .
          echo "Deploy step: push to registry and deploy to server"
      - name: Run DB Migrations
        run: npm run db:migrate

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx expo export --platform web
      - name: Deploy to Hosting
        run: echo "Deploy step: upload web build to hosting provider"
