          volumes:
          - name: backup-scripts
            configMap:
              name: backup-scripts
              defaultMode: 0755
          - name: tmp
            emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backup-verification
  namespace: kaytx
spec:
  template:
    spec:
      serviceAccountName: kaytx-sa
      restartPolicy: OnFailure
      containers:
      - name: backup-verification
        image: amazon/aws-cli:latest
        env:
        - name: S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: S3_BUCKET
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_DEFAULT_REGION
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: AWS_DEFAULT_REGION
        command:
        - /bin/sh
        - -c
        - |
          echo "Verifying backup integrity..."
          
          # Check latest PostgreSQL backup
          LATEST_PG_BACKUP=$(aws s3 ls "s3://${S3_BUCKET}/postgres/" --recursive | sort | tail -n 1 | awk '{print $4}')
          if [ -n "$LATEST_PG_BACKUP" ]; then
            echo "Latest PostgreSQL backup: $LATEST_PG_BACKUP"
            aws s3 ls "s3://${S3_BUCKET}/$LATEST_PG_BACKUP"
          else
            echo "No PostgreSQL backups found!"
            exit 1
          fi
          
          # Check latest Redis backup
          LATEST_REDIS_BACKUP=$(aws s3 ls "s3://${S3_BUCKET}/redis/" --recursive | sort | tail -n 1 | awk '{print $4}')
          if [ -n "$LATEST_REDIS_BACKUP" ]; then
            echo "Latest Redis backup: $LATEST_REDIS_BACKUP"
            aws s3 ls "s3://${S3_BUCKET}/$LATEST_REDIS_BACKUP"
          else
            echo "No Redis backups found!"
            exit 1
          fi
          
          echo "Backup verification completed successfully"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-storage
  namespace: kaytx
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-restore-service
  namespace: kaytx
  labels:
    app: backup-restore-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backup-restore-service
  template:
    metadata:
      labels:
        app: backup-restore-service
    spec:
      serviceAccountName: kaytx-sa
      containers:
      - name: backup-restore
        image: postgres:15-alpine
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: REDIS_PASSWORD
        - name: S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: S3_BUCKET
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_DEFAULT_REGION
          valueFrom:
            secretKeyRef:
              name: backup-secrets
              key: AWS_DEFAULT_REGION
        ports:
        - containerPort: 8080
          name: http
        command:
        - /bin/sh
        - -c
        - |
          apk add --no-cache aws-cli kubectl redis-tools
          chmod +x /scripts/*.sh
          
          # Simple HTTP server for backup/restore API
          cat > /server.py << 'EOF'
          import http.server
          import socketserver
          import subprocess
          import json
          import os
          from urllib.parse import urlparse, parse_qs
          
          class BackupHandler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.path == '/health':
                      self.send_response(200)
                      self.send_header('Content-type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({'status': 'healthy'}).encode())
                  elif self.path.startswith('/list/postgres'):
                      result = subprocess.run(['aws', 's3', 'ls', f's3://{os.environ["S3_BUCKET"]}/postgres/'], capture_output=True, text=True)
                      self.send_response(200)
                      self.send_header('Content-type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({'backups': result.stdout.splitlines()}).encode())
                  elif self.path.startswith('/list/redis'):
                      result = subprocess.run(['aws', 's3', 'ls', f's3://{os.environ["S3_BUCKET"]}/redis/'], capture_output=True, text=True)
                      self.send_response(200)
                      self.send_header('Content-type', 'application/json')
                      self.end_headers()
                      self.wfile.write(json.dumps({'backups': result.stdout.splitlines()}).encode())
                  else:
                      self.send_response(404)
                      self.end_headers()
              
              def do_POST(self):
                  if self.path.startswith('/restore/postgres'):
                      content_length = int(self.headers['Content-Length'])
                      post_data = self.rfile.read(content_length)
                      data = json.loads(post_data.decode('utf-8'))
                      backup_file = data.get('backup_file')
                      
                      if backup_file:
                          result = subprocess.run(['/scripts/restore-postgres.sh', backup_file], capture_output=True, text=True)
                          self.send_response(200 if result.returncode == 0 else 500)
                          self.send_header('Content-type', 'application/json')
                          self.end_headers()
                          self.wfile.write(json.dumps({'result': result.stdout, 'error': result.stderr}).encode())
                      else:
                          self.send_response(400)
                          self.end_headers()
                  elif self.path.startswith('/restore/redis'):
                      content_length = int(self.headers['Content-Length'])
                      post_data = self.rfile.read(content_length)
                      data = json.loads(post_data.decode('utf-8'))
                      backup_file = data.get('backup_file')
                      
                      if backup_file:
                          result = subprocess.run(['/scripts/restore-redis.sh', backup_file], capture_output=True, text=True)
                          self.send_response(200 if result.returncode == 0 else 500)
                          self.send_header('Content-type', 'application/json')
                          self.end_headers()
                          self.wfile.write(json.dumps({'result': result.stdout, 'error': result.stderr}).encode())
                      else:
                          self.send_response(400)
                          self.end_headers()
                  else:
                      self.send_response(404)
                      self.end_headers()
          
          with socketserver.TCPServer(("", 8080), BackupHandler) as httpd:
              print("Backup restore service started on port 8080")
              httpd.serve_forever()
          EOF
          
          python3 /server.py
        volumeMounts:
        - name: backup-scripts
          mountPath: /scripts
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: backup-storage
          mountPath: /backups
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: backup-scripts
        configMap:
          name: backup-scripts
          defaultMode: 0755
      - name: tmp
        emptyDir: {}
      - name: backup-storage
        persistentVolumeClaim:
          claimName: backup-storage
---
apiVersion: v1
kind: Service
metadata:
  name: backup-restore-service
  namespace: kaytx
  labels:
    app: backup-restore-service
spec:
  selector:
    app: backup-restore-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  type: ClusterIP
